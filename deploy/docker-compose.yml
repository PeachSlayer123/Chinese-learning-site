# De app op de Raspberry Pi. Starten vanuit de root van de repo:
#   docker compose -f deploy/docker-compose.yml up -d --build
# Staat los van Home Assistant (~/homeassistant): eigen project, eigen poort.
name: chinees

services:
  app:
    build:
      context: ..
    container_name: chinees
    restart: unless-stopped
    env_file: ../.env
    # Host-netwerk: nodig om de desktop te wekken met Wake-on-LAN (broadcast op het thuisnetwerk).
    # De app luistert dan rechtstreeks op poort 8080 van de Pi.
    network_mode: host
    volumes:
      - ../data:/data
