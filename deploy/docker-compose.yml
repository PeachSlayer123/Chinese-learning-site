# De app op de Raspberry Pi. Starten vanuit de root van de repo:
#   docker compose -f deploy/docker-compose.yml up -d --build
# Staat los van Home Assistant (~/homeassistant): eigen project, eigen poort.
name: chinees

services:
  app:
    build:
      context: ..
    container_name: chinees
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "8080:8080"
    volumes:
      - ../data:/data
